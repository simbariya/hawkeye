<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hawkeye</title>
    <base href="/" />
    <link href="Hawkeye.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/hawkeye.css" />
</head>
<body>
    <div id="app"></div>
    <script>
        // Natural height of the meter content, for "fit height to group" (MeterPage asks after each layout change).
        window.hawkeyeMeasure = function () {
            var shell = document.querySelector('.shell.is-auto');
            return shell ? Math.ceil(shell.getBoundingClientRect().height) : 0;
        };
    </script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
