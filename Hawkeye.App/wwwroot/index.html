<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hawkeye</title>
    <base href="/" />
    <link href="Hawkeye.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/hawkeye.css" />
    <link rel="stylesheet" href="css/meter.css" />
</head>
<body>
    <div id="app"></div>
    <script>
        // Natural height of the meter content, for "fit height to group" (MeterPage asks after each layout change).
        // Side strip: how many 16px buttons (5px apart) fit between its top and the frame's bottom edge.
        window.hawkeyeSideSlots = function () {
            var shell = document.querySelector('.shell'), side = document.querySelector('.meter-side');
            if (!shell || !side) return 99;
            var room = shell.getBoundingClientRect().bottom - 8 - side.getBoundingClientRect().top;
            return Math.max(1, Math.floor((room + 5) / 21));
        };
        // Window height that shows the whole (unfolded) strip.
        window.hawkeyeSideNeed = function () {
            var shell = document.querySelector('.shell'), side = document.querySelector('.meter-side');
            if (!shell || !side) return 0;
            return Math.ceil(side.getBoundingClientRect().bottom - shell.getBoundingClientRect().top + 10);
        };
        window.hawkeyeMeasure = function () {
            var shell = document.querySelector('.shell.is-auto');
            return shell ? Math.ceil(shell.getBoundingClientRect().height) : 0;
        };
    </script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
